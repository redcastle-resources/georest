name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          # One macOS cell for coverage of the third major platform.
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Offline test suite (pytest)
        # EDW_LIVE / SERVICES_LIVE deliberately unset: offline and deterministic.
        # The live suite runs on a schedule in live.yml instead, because EDW
        # intermittently answers 404/500/"Layer not found" for services that
        # work moments later — noise that would say nothing about a change.
        run: python -m pytest -ra

      - name: Offline test suite (stdlib unittest)
        # Both entry points are documented, so both are exercised.
        run: python -m unittest discover -s tests -t .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
      # `ruff format --check` is deliberately NOT run yet: this code predates
      # any formatter, so adopting one would reformat 21 files at once. That
      # belongs in its own single-purpose commit, not mixed into unrelated
      # diffs. Enable this line as part of that commit.
      # - run: ruff format --check .

  build:
    name: Build and inspect the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install build "twine>=6.1"
      - run: python -m build

      - name: twine check
        run: python -m twine check --strict dist/*

      - name: The wheel must contain the package and nothing else
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          print("\n".join(sorted(names)))
          assert "geoREST/__init__.py" in names
          assert "geoREST/RESTesri/edw.py" in names
          assert "geoREST/py.typed" in names
          stray = [n for n in names if not n.startswith(("geoREST/", "georest-"))]
          assert not stray, f"unexpected files in the wheel: {stray}"
          assert not [n for n in names if n.endswith(".ipynb")], "notebooks leaked"
          assert not [n for n in names if "/tests/" in n], "tests leaked"
          assert not [n for n in names if "layer_cache" in n], "fixture leaked"
          PY

      - name: Install the wheel in a clean env and smoke test it
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --no-index dist/*.whl
          # cd out of the repo: with a src/ layout nothing can shadow the install,
          # which is the whole point of using one.
          cd /tmp
          /tmp/verify/bin/python -c "
          import geoREST
          from geoREST.RESTesri import edw, portal, services
          assert geoREST.edw is edw
          print('version', geoREST.__version__)
          print('themes', len(edw._SERVICE_THEMES))
          print('portals', sorted(portal.PORTALS))
          "
          /tmp/verify/bin/georest-check-themes --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
