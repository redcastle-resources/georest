name: Live (network) tests

# Kept out of CI on purpose. EDW intermittently answers 404, 500,
# "Layer not found", or 200-with-no-layers for services that work moments
# later; a red run here says nothing about the code, so it must never block
# a pull request.

on:
  schedule:
    - cron: "17 11 * * 1"        # Mondays, off-the-hour to dodge scheduler pileup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"

      - name: Full suite against the live servers
        env:
          EDW_LIVE: "1"
          SERVICES_LIVE: "1"
        run: python -m pytest -ra || true

      - name: Theme-table drift report
        # The real value of this workflow: _SERVICE_THEMES is hand-curated and
        # rots as EDW publishes and retires services. This notices without
        # anyone having to remember to look. Exit 1 = drifted, 2 = unreachable.
        run: georest-check-themes || true
